# Compiles the app on a macOS runner without signing, and runs the package tests.
# Runs on every push so compile errors surface without a Mac.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version

      - name: Engine tests
        run: swift test --package-path TareEngine

      - name: Files tests
        run: swift test --package-path TareFiles

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Tare.xcodeproj -scheme Tare

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Tare.xcodeproj -scheme Tare \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData build 2>&1 | tee build.log | grep -E "error:|warning:|note: |BUILD|Build target|\*\* " || true
          if grep -q "BUILD SUCCEEDED" build.log; then exit 0; fi
          echo "----- errors with context -----"
          grep -B3 -A8 "error:" build.log | head -400
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
